# DANDADAN Omarchy 4.0 Quickshell Surface Styling — Wallpaper 01: Okarun & Turbo Granny Golden Spark

[bar]
background       = "#14161E"
background-alpha = 0.92
text             = "#F0F4FC"
active           = "#E3847B"
scale-with-font  = true
size-horizontal  = 30
size-vertical    = 32

[hyprland]
active-border            = "#E80202 #01E8E8 45deg"
active-border-foreground = "#F0F4FC"

[controls]
normal-color        = "#F0F4FC"
normal-fill-alpha   = 0.05
normal-border       = "#F0F4FC"
normal-border-width = 1
normal-border-alpha = 0.35

hover-cursor-color        = "#FFFFFF"
hover-cursor-fill-alpha   = 0.12
hover-cursor-border       = "#E80202"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.50

focus-color        = "#FFFFFF"
focus-fill-alpha   = 0.12
focus-border       = "#E80202"
focus-border-width = 1
focus-border-alpha = 0.50

selected-color        = "#FFFFFF"
selected-fill-alpha   = 0.22
selected-border       = "#E80202"
selected-border-width = 1
selected-border-alpha = 0.80

pressed-fill-alpha   = 0.28
selection-fill-alpha = 0.35

[spacing]
scale           = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#14161E"
background-alpha = 0.95
text             = "#F0F4FC"
border           = "#E80202"
border-alpha     = 0.80
border-width     = 1

[tooltip]
background       = "#14161E"
background-alpha = 0.96
text             = "#F0F4FC"
border           = "#E80202"
border-alpha     = 0.70

[notifications]
background       = "#14161E"
background-alpha = 0.95
text             = "#F0F4FC"
border           = "#E80202"
border-alpha     = 0.85
border-width     = 1
countdown        = "#E80202"

[launcher]
background                = "#14161E"
background-alpha          = 0.95
text                      = "#F0F4FC"
border                    = "#E80202"
border-alpha              = 0.75
scrim                     = "#14161E"
scrim-alpha               = 0.55
selected-background       = "#F0F4FC"
selected-background-alpha = 0.10
selected-text             = "#E80202"
selected-border           = "#E80202"
selected-border-alpha     = 0.40

[menu]
background                = "#14161E"
background-alpha          = 0.95
text                      = "#F0F4FC"
border                    = "#E80202"
border-alpha              = 0.75
scrim                     = "#14161E"
scrim-alpha               = 0.55
selected-background       = "#F0F4FC"
selected-background-alpha = 0.10
selected-text             = "#E80202"
selected-border           = "#E80202"
selected-border-alpha     = 0.40

[polkit]
background       = "#14161E"
background-alpha = 0.96
text             = "#F0F4FC"
text-error       = "#E3847B"
border           = "#E80202"
border-error     = "#E3847B"
border-alpha     = 0.90
scrim            = "#14161E"
scrim-alpha      = 0.60
accent           = "#E80202"

[lock]
background       = "#14161E"
background-alpha = 0.85
text             = "#F0F4FC"
placeholder      = "#8B90A0"
text-error       = "#E3847B"
border           = "#E80202"
border-active    = "#E80202"
border-error     = "#E3847B"
border-alpha     = 0.90
selection        = "#E80202"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#14161E"
scrim-alpha             = 0.55
text                    = "#F0F4FC"
selected-border         = "#E80202"
selected-border-alpha   = 1.0
unselected-border       = "#F0F4FC"
unselected-border-alpha = 0.30
